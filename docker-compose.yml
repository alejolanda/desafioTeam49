services:
  app:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"

    # La configuracion se inyecta en ejecucion; nunca se hornea en la imagen.
    # El .env no entra al contexto de build (ver .dockerignore).
    env_file:
      - .env
    environment:
      PORT: "${PORT:-5000}"
      # Nunca el depurador de Werkzeug en un contenedor: permite ejecutar
      # codigo de forma remota.
      FLASK_DEBUG: "0"

    # Las boletas se borran en cuanto se analizan; no necesitan disco ni deben
    # sobrevivir al contenedor. tmpfs las mantiene en memoria y fuera de la capa
    # de escritura.
    tmpfs:
      - /app/uploads:mode=1777,size=32m

    # El codigo montado encima para desarrollo: se edita y gunicorn recarga sin
    # reconstruir la imagen. Solo lectura, para que el contenedor no pueda
    # modificar el arbol de trabajo.
    volumes:
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    command: >
      sh -c "exec gunicorn app:app
      --bind 0.0.0.0:${PORT:-5000}
      --workers 1
      --threads 8
      --worker-class gthread
      --timeout 60
      --reload
      --access-logfile -
      --error-logfile -"

    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','5000')+'/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

# Para escalar a varios workers hace falta antes un almacenamiento compartido:
# el limite de tasa y la cache de geocodificacion viven hoy en la memoria del
# proceso. Descomentar y poner RATELIMIT_STORAGE_URI=redis://redis:6379 en .env
#
#  redis:
#    image: redis:7-alpine
#    restart: unless-stopped
